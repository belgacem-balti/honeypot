name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/taskflow

jobs:
  security-scan:
    name: Security Scans
    runs-on: ubuntu-latest
    
    steps:
      # Stage 1: Source Checkout
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for Gitleaks
      
      # Stage 2: Secret Detection
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}  # Optional: for commercial features
      
      # Stage 3a: Dependency Scan - npm audit
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json
      
      - name: Install client dependencies
        run: cd client && npm ci
      
      - name: Run npm audit (client)
        run: |
          cd client
          npm audit --audit-level=high --json > ../npm-audit-client.json || true
          npm audit --audit-level=high
        continue-on-error: false
      
      - name: Install server dependencies
        run: cd server && npm ci
      
      - name: Run npm audit (server)
        run: |
          cd server
          npm audit --audit-level=high --json > ../npm-audit-server.json || true
          npm audit --audit-level=high
        continue-on-error: false
      
      # Stage 3b: Trivy Filesystem Scan
      - name: Run Trivy filesystem scan (client)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'client/'
          severity: 'CRITICAL,HIGH'
          format: 'json'
          output: 'trivy-fs-client.json'
          exit-code: '1'  # Fail on findings
      
      - name: Run Trivy filesystem scan (server)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'server/'
          severity: 'CRITICAL,HIGH'
          format: 'json'
          output: 'trivy-fs-server.json'
          exit-code: '1'
      
      # Stage 4: SAST - Semgrep
      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/javascript
            p/react
            p/nodejs
            p/security-audit
          generateSarif: true
      
      # Upload scan results
      - name: Upload security scan artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-scan-results
          path: |
            npm-audit-*.json
            trivy-fs-*.json
            semgrep-results.json
          retention-days: 30

  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    needs: security-scan
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json
      
      # Install dependencies (already audited in previous job)
      - name: Install dependencies
        run: |
          cd client && npm ci
          cd ../server && npm ci
      
      # Run unit tests (server)
      - name: Run server tests
        run: cd server && npm test
        env:
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
          JWT_SECRET: ${{ secrets.TEST_JWT_SECRET }}
      
      # Run client tests
      - name: Run client tests
        run: cd client && npm test
      
      # Stage 5: Build Docker images
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build client image
        uses: docker/build-push-action@v5
        with:
          context: ./client
          file: ./client/Dockerfile
          push: false
          tags: taskflow-client:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true
      
      - name: Build server image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          push: false
          tags: taskflow-server:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true
      
      # Stage 6: Container Image Scan
      - name: Scan client image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: taskflow-client:${{ github.sha }}
          format: 'json'
          output: 'trivy-image-client.json'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
      
      - name: Scan server image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: taskflow-server:${{ github.sha }}
          format: 'json'
          output: 'trivy-image-server.json'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
      
      # Stage 7: SBOM Generation
      - name: Generate SBOM for client
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: taskflow-client:${{ github.sha }}
          format: 'cyclonedx'
          output: 'sbom-client.json'
      
      - name: Generate SBOM for server
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: taskflow-server:${{ github.sha }}
          format: 'cyclonedx'
          output: 'sbom-server.json'
      
      # Stage 10: Push to Registry
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Tag and push client image
        run: |
          docker tag taskflow-client:${{ github.sha }} ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-client:${{ github.sha }}
          docker tag taskflow-client:${{ github.sha }} ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-client:latest
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-client:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-client:latest
      
      - name: Tag and push server image
        run: |
          docker tag taskflow-server:${{ github.sha }} ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-server:${{ github.sha }}
          docker tag taskflow-server:${{ github.sha }} ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-server:latest
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-server:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-server:latest
      
      # Upload artifacts
      - name: Upload image scan results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: image-scan-results
          path: |
            trivy-image-*.json
            sbom-*.json
          retention-days: 90
