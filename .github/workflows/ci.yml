name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/taskflow
  # Unit tests mock Prisma; these values are only used if a test reads env.
  TEST_JWT_SECRET: ${{ secrets.TEST_JWT_SECRET }}

jobs:
  security-scan:
    name: Security Scans
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Install client dependencies
        run: cd client && npm ci

      - name: Run npm audit (client)
        continue-on-error: true
        run: |
          cd client
          npm audit --audit-level=high --json > ../npm-audit-client.json || true
          npm audit --audit-level=high

      - name: Install server dependencies
        run: cd server && npm ci

      - name: Run npm audit (server)
        continue-on-error: true
        run: |
          cd server
          npm audit --audit-level=high --json > ../npm-audit-server.json || true
          npm audit --audit-level=high

      # Honeypot images contain intentional CVEs. exit-code 0 keeps the
      # pipeline green while still uploading findings as artifacts.
      - name: Run Trivy filesystem scan (client)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: client/
          severity: CRITICAL,HIGH
          format: json
          output: trivy-fs-client.json
          exit-code: "0"
          trivyignores: .trivyignore

      - name: Run Trivy filesystem scan (server)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: server/
          severity: CRITICAL,HIGH
          format: json
          output: trivy-fs-server.json
          exit-code: "0"
          trivyignores: .trivyignore

      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1
        continue-on-error: true
        with:
          config: >-
            p/javascript
            p/react
            p/nodejs
            p/security-audit
          generateSarif: true

      - name: Upload security scan artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-scan-results
          path: |
            npm-audit-*.json
            trivy-fs-*.json
            semgrep-results.json
          retention-days: 30

  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    needs: security-scan
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Install dependencies
        run: |
          cd client && npm ci
          cd ../server && npm ci

      - name: Run server tests
        run: cd server && npm test
        env:
          NODE_ENV: test
          JWT_SECRET: ${{ secrets.TEST_JWT_SECRET || 'ci_test_jwt_secret_not_for_production' }}
          JWT_EXPIRES_IN: 7d

      - name: Run client tests
        run: cd client && npm test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build client image
        uses: docker/build-push-action@v5
        with:
          context: ./client
          file: ./client/Dockerfile.hardened
          push: false
          tags: taskflow-client:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      - name: Build server image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile.hardened
          push: false
          tags: taskflow-server:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      - name: Scan client image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: taskflow-client:${{ github.sha }}
          format: json
          output: trivy-image-client.json
          severity: CRITICAL,HIGH
          exit-code: "0"
          trivyignores: .trivyignore

      - name: Scan server image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: taskflow-server:${{ github.sha }}
          format: json
          output: trivy-image-server.json
          severity: CRITICAL,HIGH
          exit-code: "0"
          trivyignores: .trivyignore

      - name: Generate SBOM for client
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: taskflow-client:${{ github.sha }}
          format: cyclonedx
          output: sbom-client.json

      - name: Generate SBOM for server
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: taskflow-server:${{ github.sha }}
          format: cyclonedx
          output: sbom-server.json

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push client image
        if: github.event_name != 'pull_request'
        run: |
          docker tag "taskflow-client:${{ github.sha }}" \
            "${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-client:${{ github.sha }}"
          docker tag "taskflow-client:${{ github.sha }}" \
            "${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-client:latest"
          docker push "${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-client:${{ github.sha }}"
          docker push "${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-client:latest"

      - name: Tag and push server image
        if: github.event_name != 'pull_request'
        run: |
          docker tag "taskflow-server:${{ github.sha }}" \
            "${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-server:${{ github.sha }}"
          docker tag "taskflow-server:${{ github.sha }}" \
            "${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-server:latest"
          docker push "${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-server:${{ github.sha }}"
          docker push "${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-server:latest"

      - name: Upload image scan results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: image-scan-results
          path: |
            trivy-image-*.json
            sbom-*.json
          retention-days: 90
