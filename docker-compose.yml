version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: taskflow-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: taskflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d taskflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: taskflow-server
    restart: always
    environment:
      DATABASE_URL: "postgresql://postgres:password@postgres:5432/taskflow?schema=public"
      JWT_SECRET: "taskflow_production_jwt_secret_key_2024"
      JWT_EXPIRES_IN: "7d"
      PORT: 5000
      CLIENT_URL: "http://localhost"
      NODE_ENV: "production"
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: taskflow-client
    restart: always
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      - server

volumes:
  postgres_data:
