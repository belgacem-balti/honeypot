# Gitleaks Configuration for Secret Detection
# https://github.com/gitleaks/gitleaks

title = "Gitleaks configuration for Honeypot project"

# Custom rule for JWT_SECRET detection
[[rules]]
id = "jwt-secret"
description = "Detected JWT_SECRET in environment files"
regex = '''(?i)(jwt[_-]?secret|jwt[_-]?key)\s*[=:]\s*['"]?[a-zA-Z0-9+/=_-]{20,}['"]?'''
tags = ["secret", "jwt"]
[[rules.entropies]]
Min = "3.5"
Max = "8"

# Custom rule for DATABASE_URL detection
[[rules]]
id = "database-url"
description = "Detected DATABASE_URL with credentials"
regex = '''(?i)(database[_-]?url|db[_-]?url|connection[_-]?string)\s*[=:]\s*['"]?(postgresql|postgres|mysql|mongodb|mariadb)://[^:]+:[^@]+@[^\s'"]+['"]?'''
tags = ["secret", "database"]

# Generic password patterns
[[rules]]
id = "generic-password"
description = "Detected generic password patterns"
regex = '''(?i)(password|passwd|pwd|pass)\s*[=:]\s*['"][^'"\s]{8,}['"]'''
tags = ["secret", "password"]

# AWS Access Key ID
[[rules]]
id = "aws-access-key-id"
description = "AWS Access Key ID"
regex = '''(A3T[A-Z0-9]|AKIA|AGPA|AIDA|AROA|AIPA|ANPA|ANVA|ASIA)[A-Z0-9]{16}'''
tags = ["aws", "secret"]

# AWS Secret Access Key
[[rules]]
id = "aws-secret-access-key"
description = "AWS Secret Access Key"
regex = '''(?i)aws[_-]?secret[_-]?access[_-]?key[_-]?\s*[=:]\s*['"]?[a-zA-Z0-9/+=]{40}['"]?'''
tags = ["aws", "secret"]

# Generic Private Key
[[rules]]
id = "private-key"
description = "Private Key (RSA, SSH, PGP, etc.)"
regex = '''-----BEGIN\s+(RSA|EC|DSA|OPENSSH|PGP)\s+PRIVATE\s+KEY-----'''
tags = ["secret", "private-key"]

# OAuth Token
[[rules]]
id = "oauth-token"
description = "OAuth Token"
regex = '''(?i)(oauth[_-]?token|access[_-]?token|auth[_-]?token)\s*[=:]\s*['"]?[a-zA-Z0-9_\-\.]{20,}['"]?'''
tags = ["secret", "oauth"]
[[rules.entropies]]
Min = "3.5"
Max = "8"

# Generic API Key
[[rules]]
id = "api-key"
description = "Generic API Key"
regex = '''(?i)(api[_-]?key|apikey)\s*[=:]\s*['"]?[a-zA-Z0-9_\-]{20,}['"]?'''
tags = ["secret", "api-key"]
[[rules.entropies]]
Min = "3.0"
Max = "8"

[allowlist]
description = "Skip dependencies, generated files, docs, and known honeypot fixtures"
paths = [
  '''(^|/)node_modules/''',
  '''(^|/)\.git/''',
  '''(^|/)dist/''',
  '''(^|/)build/''',
  '''(^|/)coverage/''',
  '''(^|/)\.agents/''',
  '''(^|/)e2e/''',
  '''(?i)(^|/)(.*\.)?(test|spec)\.[jt]sx?$''',
  '''docker-compose\.insecure\.yml''',
  '''Dockerfile\.insecure''',
  '''kubernetes-secrets\.yaml''',
  '''backup\.sql''',
  '''\.git-secrets-example''',
  '''\.env\.example$''',
  '''debug\.log''',
  '''README\.md''',
  '''PIPELINE\.md''',
  '''VULNERABILITIES-ADDED\.md'''
]
