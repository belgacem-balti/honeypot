version: "3.8"
services:
  ai-soc-dashboard:
    build: .
    container_name: ai-soc-dashboard
    restart: always
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - GROQ_API_KEY=${GROQ_API_KEY}
      - ABUSEIPDB_API_KEY=${ABUSEIPDB_API_KEY}
      - OTX_API_KEY=${OTX_API_KEY}
      - WAZUH_ALERT_MIN_LEVEL=5
