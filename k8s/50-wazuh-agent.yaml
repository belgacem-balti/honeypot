# Wazuh agent DaemonSet: one agent per node, shipping the TaskFlow pod logs to
# the manager running outside the cluster (wazuh/docker-compose.yml).
#
# Namespace security-monitoring enforces Pod Security "privileged" (documented
# exception in 00-namespaces.yaml): the agent needs read-only hostPath mounts on
# /var/log/pods, and the image (s6-overlay) starts as root and drops to the
# wazuh user itself. Everything else is still restricted: no hostNetwork (so
# k8s/41-networkpolicies-monitoring.yaml applies), no privileged mode, minimal
# capabilities, no ServiceAccount token, limits.
#
# Required Secret created out of band (see wazuh/README.md):
#   kubectl -n security-monitoring create secret generic wazuh-agent-enrollment \
#     --from-literal=WAZUH_REGISTRATION_PASSWORD='FAKE-wazuh-enrollment-password'
apiVersion: v1
kind: ServiceAccount
metadata:
  name: wazuh-agent
  namespace: security-monitoring
  labels:
    app.kubernetes.io/name: wazuh-agent
    app.kubernetes.io/part-of: taskflow
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: wazuh-agent-config
  namespace: security-monitoring
  labels:
    app.kubernetes.io/name: wazuh-agent
    app.kubernetes.io/part-of: taskflow
data:
  # Wildcard locations are re-scanned every 64 s by default, and a newly found
  # file is read from its end: the first lines of a new pod (often right after
  # a redeploy) would be lost. Re-scan every 5 s.
  local_internal_options.conf: |
    logcollector.vcheck_files=5
  # Copied to /var/ossec/etc/ossec.conf by the image init script, which replaces
  # the CHANGE_* placeholders with the WAZUH_* environment variables.
  ossec.conf: |
    <ossec_config>
      <client>
        <server>
          <address>CHANGE_MANAGER_IP</address>
          <port>CHANGE_MANAGER_PORT</port>
          <protocol>tcp</protocol>
        </server>
        <notify_time>10</notify_time>
        <time-reconnect>60</time-reconnect>
        <auto_restart>yes</auto_restart>
        <crypto_method>aes</crypto_method>
        <enrollment>
          <enabled>yes</enabled>
          <manager_address>CHANGE_ENROLL_IP</manager_address>
          <port>CHANGE_ENROLL_PORT</port>
          <agent_name>CHANGE_AGENT_NAME</agent_name>
          <groups>CHANGE_AGENT_GROUP</groups>
          <authorization_pass_path>etc/authd.pass</authorization_pass_path>
        </enrollment>
      </client>

      <client_buffer>
        <disabled>no</disabled>
        <queue_size>5000</queue_size>
        <events_per_second>500</events_per_second>
      </client_buffer>

      <!-- TaskFlow server logs, both application namespaces (CRI format, one JSON object per line) -->
      <localfile>
        <log_format>syslog</log_format>
        <location>/var/log/pods/honeypot-*_server-*/server/*.log</location>
        <!-- Do not skip lines written while the agent was restarting -->
        <only-future-events>no</only-future-events>
      </localfile>

      <!-- nginx access/error logs of the client -->
      <localfile>
        <log_format>syslog</log_format>
        <location>/var/log/pods/honeypot-*_client-*/client/*.log</location>
        <!-- Do not skip lines written while the agent was restarting -->
        <only-future-events>no</only-future-events>
      </localfile>

      <rootcheck>
        <disabled>yes</disabled>
      </rootcheck>
      <wodle name="syscollector">
        <disabled>yes</disabled>
      </wodle>
      <sca>
        <enabled>no</enabled>
      </sca>
      <syscheck>
        <disabled>yes</disabled>
      </syscheck>
    </ossec_config>
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: wazuh-agent
  namespace: security-monitoring
  labels:
    app.kubernetes.io/name: wazuh-agent
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: taskflow
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: wazuh-agent
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wazuh-agent
        app.kubernetes.io/component: monitoring
        app.kubernetes.io/part-of: taskflow
    spec:
      serviceAccountName: wazuh-agent
      automountServiceAccountToken: false
      hostNetwork: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      tolerations:
        # Also collect logs on the control-plane node
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: wazuh-agent
          image: wazuh/wazuh-agent:4.14.10
          imagePullPolicy: IfNotPresent
          env:
            - name: WAZUH_MANAGER_SERVER
              # WAZUH_MANAGER_IP: substituted at apply time, see wazuh/README.md
              value: "172.18.0.100"
            - name: WAZUH_MANAGER_PORT
              value: "1514"
            - name: WAZUH_REGISTRATION_PORT
              value: "1515"
            - name: WAZUH_AGENT_GROUP
              value: default
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: WAZUH_AGENT_NAME
              value: "k8s-$(NODE_NAME)"
            - name: WAZUH_REGISTRATION_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wazuh-agent-enrollment
                  key: WAZUH_REGISTRATION_PASSWORD
          securityContext:
            # Root is required by the image init (s6-overlay, chown of /var/ossec);
            # daemons then run as the wazuh user.
            runAsUser: 0
            privileged: false
            allowPrivilegeEscalation: false
            # /var/ossec and s6 runtime directories are written at start
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "SETGID", "SETUID", "KILL"]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            exec:
              command: ["/var/ossec/bin/wazuh-control", "status"]
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            exec:
              command: ["sh", "-c", "/var/ossec/bin/wazuh-control status | grep -q 'wazuh-agentd is running'"]
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 10
          volumeMounts:
            - name: agent-config
              mountPath: /wazuh-config-mount/etc/ossec.conf
              subPath: ossec.conf
              readOnly: true
            - name: agent-config
              mountPath: /wazuh-config-mount/etc/local_internal_options.conf
              subPath: local_internal_options.conf
              readOnly: true
            - name: varlogpods
              mountPath: /var/log/pods
              readOnly: true
      volumes:
        - name: agent-config
          configMap:
            name: wazuh-agent-config
        - name: varlogpods
          hostPath:
            path: /var/log/pods
            type: Directory
