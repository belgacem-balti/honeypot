# Caps what the decoy namespace can consume so a flood or exploit cannot starve
# the node, and forbids NodePort/LoadBalancer exposure from inside the namespace.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: decoy-quota
spec:
  hard:
    pods: "10"
    requests.cpu: "1"
    requests.memory: 1Gi
    limits.cpu: "2"
    limits.memory: 1536Mi
    persistentvolumeclaims: "2"
    requests.storage: 2Gi
    services.nodeports: "0"
    services.loadbalancers: "0"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: decoy-defaults
spec:
  limits:
    - type: Container
      default:
        cpu: 200m
        memory: 128Mi
      defaultRequest:
        cpu: 50m
        memory: 64Mi
      max:
        cpu: "1"
        memory: 768Mi
