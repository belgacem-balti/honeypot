# ClusterIP only; reach it locally with kubectl port-forward (see README).
apiVersion: v1
kind: Service
metadata:
  name: client
  labels:
    app.kubernetes.io/name: client
    app.kubernetes.io/part-of: honeypotx
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: client
  ports:
    - name: http
      port: 8080
      targetPort: http
