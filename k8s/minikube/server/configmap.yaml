# Non-sensitive server configuration. Secrets (DATABASE_URL, JWT_SECRET) live in
# the "decoy-secrets" Secret, which is created out-of-band (see README).
apiVersion: v1
kind: ConfigMap
metadata:
  name: server-config
  labels:
    app.kubernetes.io/name: server
    app.kubernetes.io/part-of: honeypotx
data:
  NODE_ENV: production
  PORT: "5000"
  JWT_EXPIRES_IN: 7d
  CLIENT_URL: http://localhost:8080
