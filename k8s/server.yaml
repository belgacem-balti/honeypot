apiVersion: apps/v1
kind: Deployment
metadata:
  name: server
  namespace: honeypot
  labels:
    app: server
spec:
  replicas: 2
  selector:
    matchLabels:
      app: server
  template:
    metadata:
      labels:
        app: server
    spec:
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          command:
            - sh
            - -c
            - until pg_isready -h postgres-service -U postgres -d taskflow && pg_isready -h postgres-shard-1-service -U postgres -d taskflow; do sleep 2; done
      containers:
        - name: server
          image: honeypot-server:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 5000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: DATABASE_URL
            - name: DATABASE_URL_SHARD_0
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: DATABASE_URL_SHARD_0
            - name: DATABASE_URL_SHARD_1
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: DATABASE_URL_SHARD_1
            - name: SHARD_COUNT
              value: "2"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: server-secret
                  key: JWT_SECRET
            - name: JWT_EXPIRES_IN
              value: "7d"
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: security-secret
                  key: GROQ_API_KEY
            - name: ABUSEIPDB_API_KEY
              valueFrom:
                secretKeyRef:
                  name: security-secret
                  key: ABUSEIPDB_API_KEY
            - name: OTX_API_KEY
              valueFrom:
                secretKeyRef:
                  name: security-secret
                  key: OTX_API_KEY
            - name: PORT
              value: "5000"
            - name: CLIENT_URL
              value: "http://honeypot.local"
            - name: NODE_ENV
              value: "production"
            - name: NODE_ROLE
              value: api
            - name: REDIS_URL
              value: "redis://redis-service:6379"
            - name: RABBITMQ_URL
              value: "amqp://guest:guest@rabbitmq-service:5672"
            - name: CACHE_TTL_SECONDS
              value: "60"
            - name: MIN_REPLICAS
              value: "2"
            - name: MAX_REPLICAS
              value: "8"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: server-service
  namespace: honeypot
spec:
  selector:
    app: server
  sessionAffinity: None
  ports:
    - port: 5000
      targetPort: 5000
  type: ClusterIP
