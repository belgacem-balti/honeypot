# NetworkPolicies for the security-monitoring namespace (Wazuh agent DaemonSet,
# k8s/50-wazuh-agent.yaml). Kept apart from 40-networkpolicies.yaml because these
# objects carry an explicit namespace, which "kubectl apply -n <app ns>" rejects.
#
# The Wazuh manager runs outside the cluster (wazuh/docker-compose.yml). The
# ipBlock below is the default Docker network used by kind ("kind", 172.18.0.0/16).
# Check yours with:
#   docker network inspect kind -f '{{(index .IPAM.Config 0).Subnet}}'
# and narrow it to the manager's address (/32) once known.
# The agent must NOT use hostNetwork, otherwise these policies do not apply to it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: security-monitoring
  labels:
    app.kubernetes.io/part-of: taskflow
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: quarantine-isolate
  namespace: security-monitoring
  labels:
    app.kubernetes.io/part-of: taskflow
spec:
  # Marker only; isolation comes from the NotIn exclusions below.
  podSelector:
    matchLabels:
      quarantine: "true"
  policyTypes: ["Ingress", "Egress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: security-monitoring
  labels:
    app.kubernetes.io/part-of: taskflow
spec:
  podSelector:
    matchExpressions:
      - { key: quarantine, operator: NotIn, values: ["true"] }
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: wazuh-agent-allow-egress-to-manager
  namespace: security-monitoring
  labels:
    app.kubernetes.io/part-of: taskflow
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: wazuh-agent
    matchExpressions:
      - { key: quarantine, operator: NotIn, values: ["true"] }
  policyTypes: ["Egress"]
  egress:
    - to:
        - ipBlock:
            cidr: 172.18.0.0/16
      ports:
        # 1514: agent events, 1515: agent enrollment (authd)
        - { protocol: TCP, port: 1514 }
        - { protocol: TCP, port: 1515 }
