apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: honeypot-ingress
  namespace: honeypot
spec:
  ingressClassName: nginx
  rules:
    - host: honeypot.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: server-service
                port:
                  number: 5000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: client-service
                port:
                  number: 80
