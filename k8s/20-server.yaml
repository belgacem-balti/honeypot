# TaskFlow API server (Express/Prisma). Namespace-less: apply with -n honeypot-vuln or -n honeypot-fixed.
#
# Required Secret created out of band (see k8s/README.md):
#   - server-secrets (keys: DATABASE_URL, JWT_SECRET)
# REDIS_URL is intentionally unset: src/config/redis.js falls back to an in-memory cache.
#
# The Service must be named "server": client/nginx.conf.hardened proxies /api/ to http://server:5000.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: server
  labels:
    app.kubernetes.io/name: server
    app.kubernetes.io/part-of: taskflow
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: server
  labels:
    app.kubernetes.io/name: server
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: taskflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: server
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: taskflow
    spec:
      serviceAccountName: server
      automountServiceAccountToken: false
      securityContext:
        # nodejs user created in server/Dockerfile.hardened
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          # Local image loaded with "kind load docker-image"; see k8s/README.md to switch to GHCR tags
          image: taskflow-server:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
          env:
            - name: PORT
              value: "5000"
            - name: NODE_ENV
              value: production
            - name: JWT_EXPIRES_IN
              value: 7d
            - name: CLIENT_URL
              value: http://taskflow.localhost
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: server-secrets
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: server-secrets
                  key: JWT_SECRET
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: server
  labels:
    app.kubernetes.io/name: server
    app.kubernetes.io/part-of: taskflow
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: server
  ports:
    - name: http
      port: 5000
      targetPort: http
