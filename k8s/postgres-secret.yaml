apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: honeypot
type: Opaque
stringData:
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: password
  POSTGRES_DB: taskflow
  DATABASE_URL: "postgresql://postgres:password@postgres-service:5432/taskflow?schema=public"
  DATABASE_URL_SHARD_0: "postgresql://postgres:password@postgres-service:5432/taskflow?schema=public"
  DATABASE_URL_SHARD_1: "postgresql://postgres:password@postgres-shard-1-service:5432/taskflow?schema=public"
