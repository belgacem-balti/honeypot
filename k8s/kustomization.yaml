apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Secrets (postgres-secret, server-secret, security-secret) are NOT listed here:
# they are not versioned. Create them from .env first:
#   scripts/create-k8s-secrets.sh
namespace: honeypot
resources:
  - namespace.yaml
  - postgres.yaml
  - postgres-shard-1.yaml
  - redis.yaml
  - rabbitmq.yaml
  - server.yaml
  - worker.yaml
  - hpa.yaml
  - client-nginx-configmap.yaml
  - client.yaml
  - ingress.yaml
