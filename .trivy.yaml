# Trivy Security Scanner Configuration
# This file defines the scan behavior for the DevSecOps pipeline

scan:
  scanners:
    - vuln
    - misconfig
    - secret
  skip-files:
    - node_modules/**
    - dist/**
    - build/**
    - coverage/**
    - .git/**
  skip-dirs:
    - node_modules
    - .git
    - dist
    - build
    - coverage

pkg:
  types:
    - os
    - library

format: json

severity:
  - CRITICAL
  - HIGH
  - MEDIUM
  - LOW

db:
  skip-update: false

timeout: 10m0s
