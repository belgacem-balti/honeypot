# INTENTIONALLY INSECURE - For DevSecOps testing only
# Missing security headers and insecure settings

server {
    listen 80;
    server_name _;
    
    # INSECURE: Server tokens reveal version information
    server_tokens on;
    
    root /usr/share/nginx/html;
    index index.html;
    
    # INSECURE: Directory listing enabled
    autoindex on;
    
    # INSECURE: Missing security headers:
    # - No X-Frame-Options (clickjacking)
    # - No X-Content-Type-Options (MIME sniffing)
    # - No Content-Security-Policy
    # - No X-XSS-Protection
    # - No Strict-Transport-Security
    # - No Referrer-Policy
    
    location / {
        try_files $uri $uri/ /index.html;
        
        # INSECURE: CORS wildcard
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "*";
        add_header Access-Control-Allow-Headers "*";
    }
    
    # INSECURE: Exposing server status
    location /nginx_status {
        stub_status on;
        allow all;  # INSECURE: No IP restriction
    }
    
    # INSECURE: Exposing .env and config files
    # No rules blocking access to sensitive files
    
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
